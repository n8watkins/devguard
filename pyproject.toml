[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-devguard"
version = "0.1.0"
description = "Run many AI coding agents in parallel on one machine without running out of memory, ports or disk."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Watkins" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/n8watkins/devguard"
Issues = "https://github.com/n8watkins/devguard/issues"
Changelog = "https://github.com/n8watkins/devguard/releases"

[project.scripts]
devguard = "devguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
