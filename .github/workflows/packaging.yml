name: Packaging
# Builds devguard the way a release does and installs it every way users can:
# the standalone build (also on a system without Python), npm, pnpm, yarn, bun,
# npx, the installer and Homebrew. Runs when the code or the packaging changes.
on:
  pull_request:
    paths: ["src/**", "install.sh", "packaging/**", "pyproject.toml", ".github/workflows/packaging.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04 # the release's Linux runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.18
      - run: packaging/build-binary.sh dist && (cd dist && sha256sum devguard-*.tar.gz > SHA256SUMS)
      - name: End-to-end walk-through against the build
        run: |
          tar -xzf dist/devguard-linux-x64.tar.gz -C "$RUNNER_TEMP"
          DEVGUARD_BIN="$RUNNER_TEMP/devguard/devguard" ./demo/e2e.sh
      - name: The build runs on a system with no Python
        run: |
          docker run --rm -v "$RUNNER_TEMP/devguard:/opt/devguard:ro" ubuntu:22.04 sh -c \
            '! command -v python3 && /opt/devguard/devguard --version && /opt/devguard/devguard port /tmp'
      - run: packaging/smoke-npm.sh dist
      - name: The installer, without gh, from these files
        run: |
          env -u GH_TOKEN DEVGUARD_DOWNLOAD_BASE="file://$PWD/dist" PATH="/usr/bin:/bin" sh install.sh --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/devguard" --version

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: packaging/build-binary.sh dist && (cd dist && shasum -a 256 devguard-*.tar.gz > SHA256SUMS)
      - name: The installer, without gh, from these files
        run: |
          DEVGUARD_DOWNLOAD_BASE="file://$PWD/dist" PATH="/usr/bin:/bin" sh install.sh --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/devguard" --version
          "$RUNNER_TEMP/bin/devguard" ps
      - name: Install and test the Homebrew formula from these files
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          DEVGUARD_DOWNLOAD_BASE: file://${{ github.workspace }}/dist
          DEVGUARD_FORMULA_PARTIAL: "1"
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          brew tap-new --no-git local/check
          node packaging/homebrew.mjs "$version" dist/SHA256SUMS > "$(brew --repository local/check)/Formula/devguard.rb"
          brew install local/check/devguard
          brew test local/check/devguard
          brew style local/check/devguard
