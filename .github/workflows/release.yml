name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
# A tag on main builds and tests devguard, then publishes it everywhere from the
# same files: the GitHub Release (standalone builds, SHA256SUMS, build
# provenance), then PyPI, npm and Homebrew when each is turned on. See
# docs/publishing.md.
jobs:
  verify:
    # Only the upstream repo publishes: a fork that pushes a tag releases nothing.
    if: github.repository == 'n8watkins/devguard'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches the version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" pyproject.toml || { echo "::error::pyproject.toml is not $version"; exit 1; }
          grep -qx "__version__ = \"$version\"" src/devguard/__init__.py || { echo "::error::src/devguard/__init__.py is not $version"; exit 1; }
          grep -q "\"version\": \"$version\"" package.json || { echo "::error::package.json is not $version"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cd tests && uv run --python 3.13 python -W error::ResourceWarning -m unittest discover -s .
      - run: ./demo/e2e.sh

  build:
    needs: verify
    strategy:
      matrix:
        include:
          # Linux builds run on the oldest supported runner, so they work on any
          # glibc at least that old (Ubuntu 22.04, Debian 12 and newer).
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: packaging/build-binary.sh dist
      - name: The build is the one this runner should make
        run: test -f "dist/devguard-${{ matrix.platform }}.tar.gz"
      - name: Run the end-to-end walk-through against the build
        if: runner.os == 'Linux'
        run: |
          tar -xzf "dist/devguard-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          DEVGUARD_BIN="$RUNNER_TEMP/devguard/devguard" ./demo/e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: dist/devguard-${{ matrix.platform }}.tar.gz
          retention-days: 7

  python:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --out-dir dist
      - name: The wheel installs and runs
        run: uv tool run --from "$(ls dist/*.whl)" devguard --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  # Only this small job can write releases and sign provenance, and it runs
  # nothing but first-party actions and gh.
  publish:
    needs: [build, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum devguard-*.tar.gz *.whl *.tar.gz | sort -u -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/devguard-*.tar.gz
            dist/*.whl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are this version's CHANGELOG.md section, which release-kit
        # wrote from the commits; GitHub's generated notes only if it has none.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}"

  # PyPI (agent-devguard): uvx agent-devguard, pipx install agent-devguard. Off
  # until the maintainer sets the repository variable PYPI_PUBLISH to true.
  pypi:
    needs: publish
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # npm (agent-devguard plus agent-devguard-<os>-<arch>). Off until the
  # maintainer sets the repository variable NPM_PUBLISH to true.
  npm:
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1 # trusted publishing needs npm 11.5.1 or newer
      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'devguard-*.tar.gz' --pattern SHA256SUMS --dir dist
      - run: cd dist && grep 'devguard-.*\.tar\.gz$' SHA256SUMS | sha256sum --check
      - run: node packaging/npm.mjs "${GITHUB_REF_NAME#v}" dist npm-out
      - name: Publish, platform packages first (a rerun skips versions already on npm)
        env:
          # Empty when trusted publishing is set up; only the first publish needs a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in npm-out/agent-devguard-* npm-out/agent-devguard; do
            spec="$(node -p "const p = require('./$package/package.json'); p.name + '@' + p.version")"
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published"; continue; fi
            npm publish "./$package" --provenance --access public
          done

  # Homebrew: writes Formula/devguard.rb in n8watkins/homebrew-tap, pushing with
  # a deploy key that can write to that one repository (the HOMEBREW_TAP_DEPLOY_KEY
  # secret). On while the repository variable HOMEBREW_TAP is true.
  homebrew:
    needs: publish
    if: vars.HOMEBREW_TAP == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the formula in the tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [ -n "$TAP_KEY" ] || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/tap-key"
          (umask 077 && printf '%s\n' "$TAP_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          # GitHub's SSH host keys from its API, so the clone never trusts an unknown host.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          git clone --depth 1 git@github.com:n8watkins/homebrew-tap.git tap
          mkdir -p tap/Formula
          node packaging/homebrew.mjs "$version" SHA256SUMS > tap/Formula/devguard.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/devguard.rb
          git diff --cached --quiet && { echo "formula already at $version"; exit 0; }
          git commit -m "devguard $version"
          git push
